<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Repeta</title>
    <meta name="description" content="Quizy i powtórki dla dzieci, na brzęczykach Buzz!, telefonach i laptopach." />
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --stage-deep: oklch(0.16 0.08 292);
        --stage: oklch(0.22 0.11 289);
        --stage-lit: oklch(0.31 0.14 287);
        --ink: oklch(0.97 0.01 280);
        --ink-dim: oklch(0.72 0.04 284);
        --dome: oklch(0.63 0.25 22);
        --blue: oklch(0.58 0.18 252);
        --orange: oklch(0.76 0.18 61);
        --green: oklch(0.71 0.22 143);
        --yellow: oklch(0.87 0.18 106);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(120% 80% at 50% -10%, var(--stage-lit) 0%, transparent 55%),
          radial-gradient(90% 60% at 50% 110%, var(--stage) 0%, transparent 60%),
          var(--stage-deep);
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      .caps {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 28px;
      }
      .caps span {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        box-shadow: inset 0 -4px 6px oklch(0 0 0 / 0.3), inset 0 3px 4px oklch(1 0 0 / 0.35);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.5rem, 10vw, 4rem);
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 32px;
        font-size: 1.125rem;
        line-height: 1.5;
        color: var(--ink-dim);
      }
      a.play {
        display: inline-block;
        padding: 14px 32px;
        border-radius: 999px;
        background: var(--dome);
        color: white;
        font-weight: 700;
        font-size: 1.125rem;
        text-decoration: none;
        box-shadow: 0 4px 0 oklch(0.45 0.2 22), inset 0 3px 4px oklch(1 0 0 / 0.35);
      }
      a.play:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 oklch(0.45 0.2 22);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="caps" aria-hidden="true">
        <span style="background: var(--blue)"></span>
        <span style="background: var(--orange)"></span>
        <span style="background: var(--dome)"></span>
        <span style="background: var(--green)"></span>
        <span style="background: var(--yellow)"></span>
      </div>
      <h1>Repeta</h1>
      <p>Quizy i powtórki dla dzieci. Grają razem: na brzęczykach Buzz!, na telefonach i na laptopie, w jednej grze.</p>
      <a class="play" href="https://app.repeta.it/">Zagraj</a>
    </main>
  </body>
</html>
